{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1>Log in</h1>

<form method="post" class="card">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Log in</button>
</form>

<p class="meta">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
{% endblock %}
